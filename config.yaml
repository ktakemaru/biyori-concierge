# ビヨリコンシェルの既定値。個人の設定(出発地の上書き・イキモノビヨリの場所)は config.local.yaml(.gitignore 対象)に書く。
# 値の出典を必ず書く。出典のない値は「仮置き」と書き、報告の「未確認」に入れる(推測で決めない)。
schema: biyori-concierge-config/1

origin:
  # 出発地の既定(利用者の決定。指示書 2 章)。座標はイキモノビヨリ ikimonobiyori/data/catalog/policy.yaml の
  # range_limit.origins の値(commit e095a61 で確認)。答える側(段階2)で使う。棚には入れない。
  default:
    name: 横浜
    lat: 35.466
    lon: 139.622
  # 出発地からの直線距離の上限(km)。利用者の決定(指示書 2 章)。直線距離であって移動時間ではない。
  max_straight_line_km: 250

combo:
  # 主役と添えるものを組み合わせる直線距離(km)。好みの仮置き。
  # イキモノビヨリ ikimonobiyori/data/ask/plan.yaml の combo.max_km(20)と同じ値(commit e095a61 で確認)。
  near_km: 20

answer:
  # 答えの字数の上限。仮置き(指示書 6.5)。
  max_chars: 2000
  # 書き直しの回数の上限(verify)。3 回目も不合格なら控えの文を出す。
  # 出典: 指示書 6.5「2 回まで。イキモノビヨリと同じ」(イキモノビヨリ data/ask/guide_mode.yaml の rewrites.max と同じ考え方)。
  max_rewrites: 2

concierge:
  # 答える側(concierge/。段階 2)の値。棚が古いとみなす時間は collect.stale_after_hours を使う(ここには重ねて書かない)。
  brief:
    # 日ごとに資料へ入れる、主役にできる山(基準点以上・危険信号が警戒未満・予報の中身あり)の数(主役の枠)。仮置き(段階 2 の作業指示書 5.2)。
    # 並びは 点数の高い順 → 危険信号の軽い順(なし → 注意。同じ段階なら数の少ない順)→ 出発地からの直線距離の近い順 → 山の ID の順。
    # 2 番目と 3 番目は好みの仮置き(安全を先に、次に近さ。段階 2 の仕上げの作業指示書 4.2)。並びのコードは concierge/brief.py の main_key。
    # 名指しの山は、この枠・見送りの枠と別に入れる。
    top_per_day: 8
    # 日ごとに資料へ入れる、基準点以上だが危険信号が「警戒」「危険」の山の数(見送りの枠)。仮置き(同 4.1)。
    # 並びは 危険の段階の重い順(危険 → 警戒。いちばん重い段階で比べ、同じならその段階の危険信号の数の多い順)→ 点数の高い順
    # → 直線距離の近い順 → 山の ID の順(concierge/brief.py の skip_key。利用者の決定 2026-11-23)。主役にはできない。
    skip_per_day: 3
    # 名指しの山どうしの、日中ピークの風速の差が「わずか」と言える境目(m/s。この値以下)。仮の値(2026-11-25。鍋割山 8.1 と筑波山 7.9 の差 0.2 m/s を
    # 危険信号の分かれ目として書いたのに、差が小さいことの説明が無かったため。出典はない)。
    small_wind_diff_ms: 0.5
    # 出発地からの直線距離の丸め方。仮置き(段階 2 の作業指示書 5.2: 10km 未満は 1km、それ以上は 5km の刻み)。
    distance:
      fine_below_km: 10
      fine_step_km: 1
      coarse_step_km: 5
    # 山の予報で答える興味の語(schemas/biyori-vocabulary.yaml の note が yamabiyori の語)。ほかの語は「足りないもの」に入る。
    mountain_interests: [hiking, mountains, clear_sky_summit, landscape_photo]
  stars:
    # 夜ごとに資料へ入れる、条件を通った星の地点の数(この枠と別に、主役にできる山の近くの地点も入る)。仮置き。
    # 並びは 主軸の地点を先 → ホシビヨリの順位(候補の夜だけにある)→ 出発地からの直線距離 → site_id(concierge/stars.py の site_key)。
    top_per_night: 5
    # 夜ごとに、上の枠の外で「直線 combo.near_km 以内に、同じ日に主役にできる山がある」地点を足す数。仮置き。
    # 候補の夜でない夜はホシビヨリの順位が無く、出発地に近い順(近くに山の無い海沿い)で枠が埋まるため(2026-11-28 の実物で、5 地点とも山なし)。
    with_mountain_per_night: 3
    # どちらのモードの結果を使うか。仮置き。milkyway_few_results = 天の川モードの候補(finals + outlooks)が thresholds.milkyway_few_results(5)
    # より少なければ星空・星座モード、そうでなければ天の川モード。ホシビヨリの explore_hoshibiyori.py が「候補が少ない場合は --target stars で…」と
    # 出す決まり(commit 3860af7)と同じ。走査した 14 夜の全部で 1 つに決める(夜ごとには変えない)。
    mode_rule: milkyway_few_results

collect:
  # 取得の側(collect/)の値。
  agents:
    yamabiyori:
      repo: ktakemaru/yamabiyori
      ref: main                     # 公開版が main(指示書 5.1)
      # HTTP リクエストの上限(計測フックで強制)。取り直しを含む全部の回の合計。
      # 利用者の決定(2026-11-11): 450。暴走を止める安全弁で、取り直しが最後まで走れる余裕を残す。
      # 考え方(指示書 5.2): 1 回目の実測に、取り直しの分の余裕を足した値。
      # 実測: 良い日(実行 B・ヤマビヨリ 1.9.1)は 1 回目 228 件で全座。悪い日(collect #4・1.9.0)は 1 回目 281 件で、
      # 欠けた山を取り直すと合計 約 340 件(利用者の見積もり)。
      max_requests: 450
      # 1 回の子プロセスの時間の上限(秒)。利用者の決定(2026-11-11): 2700。
      # 実測: 良い日 約 137 秒、悪い日(collect #4)2153 秒 → その約 1.25 倍。合計の上限(total_timeout_s)と同じ値。
      timeout_s: 2700
      # 取り直し: 1 回目のあと fetched < pool_size なら同じコマンドをもう一度実行する。1 回目を含めた回数の上限(利用者の指示「最大 3 回まで」)。
      max_runs: 3
      # 全部の回の時間の合計の上限(秒)。超えたら次の回を始めない(実行中の回もこの残りで打ち切る)。
      # 利用者の決定(2026-11-11): 2700 秒(45 分)。悪い日の実測 2153 秒の約 1.25 倍。collect.yml の timeout-minutes 90(5400 秒)の内側。
      # 1 回目が悪い日ほど長くかかると、取り直しに使える時間は残り(2700 − 1 回目)だけになる(超えたら次の回を始めない)。
      total_timeout_s: 2700
      # 計測フックが、子プロセス 1 回の中で通す 429 の回数(BIYORI_HTTP_429_MAX_TOTAL。指示書 5.2・D11。2026-11-22)。
      # 出典: ヤマビヨリ mountain_weather_core.py の MINUTELY_RETRY_MAX = 5(1 分の上限の 429 で 65 秒待って取り直すのは 1 回の実行で 5 回まで。
      # commit fdadece・1.10.1 で確認)。回数を超えた 429 はフックが即中止する。この行を消すか 0 にすると、今までどおり 429 は 1 回で即中止。
      # 429 があった回は、全部の山がそろったときだけ成功。そろわなければ rate_limited(取り直しの回を始めない)。
      # 待ちが 5 回なら 65 秒 × 5 = 325 秒が足されうるが、時間の上限(2700 秒)は変えない(U8 の実測のあとで利用者が決める)。
      http_429_max_total: 5
      # 出力の schema の文字列(mountain_weather_mvp.py --json-out。report_data.py)
      expected_schema: yamabiyori-report-data/1
    hoshibiyori:
      repo: ktakemaru/hoshibiyori
      ref: main
      # --nights に渡す夜の数(取得を始めた日から)。出典: ホシビヨリ explore_hoshibiyori.py 58 行 NUM_NIGHTS_TO_SCAN = 14
      # (commit 3860af7・1.2.0 で確認。走査するのは今日から 14 夜で、それより先の夜は調べられない)。
      nights: 14
      # HTTP リクエストの上限(計測フックで強制)。2 つのモードの合計。仮置き。
      # 式: 1 モードぶんの実測の多いほう 617 + 取り直しの余裕 617 × 0.20 × 2 + 天文暦の取得 1 = 864.8 → 870
      #   617 = ホシビヨリ AGENTS.md の時間の表(2026-11-16、全 897 地点)。手元の実測(2026-11-25 の stars.json・milkyway.json の
      #   fetch.api_calls)は 455 + 0 = 455 で、近日中(MSM)の候補の夜が 0 夜の日だったため少ない。
      #   0.20 = FAILED_CELL_RATE_ABORT(失敗したセルがこの割合以上ならホシビヨリが自分で止まる)、2 = 失敗したセルの 2 回までの再試行
      #   (cloud_forecast.py の _FETCH_MAX_RETRIES = 3 は 1 回目を含む数)。2 つ目のモードは通信 0 回の実測なので足さない。
      # 開発指示書 5.2 の「星 300」は実測の前の仮置きで、実測より少ないので使わない。
      max_requests: 870
      # 1 つのモードの子プロセスの時間の上限(秒)。仮置き。
      # 式: 実測の長いほう(天の川モード)583.2 秒 × 2 + 429 の待ち 65 秒 × 5 回 = 1491.4 → 1500
      #   実測: 2026-11-25 手元の PC(C:/temp/stage3/run-log.txt)。星空・星座モード 234.1 秒(うち通信 131.0・間隔の調整 70.7)、
      #   天の川モード 583.2 秒(通信 0.0。全部が計算)。× 2 は、GitHub のマシンの計算の速さが分からないための余裕(未確認)。
      timeout_s: 1500
      # 2 つのモードの合計の上限(秒)。超えたら次のモードを始めない。仮置き。
      # 式: (234.1 + 583.2) × 2 + 65 × 5 × 2 = 2284.6 → 2300。collect.yml の timeout-minutes 90(5400 秒)から山の上限 2700 を引いた
      # 残りの 2700 秒の内側で、準備(取り出し・pip・メタデータ・成果物の保存)に 400 秒が残る。
      total_timeout_s: 2300
      # 計測フックが、子プロセス 1 回(1 つのモード)の中で通す 429 の回数(BIYORI_HTTP_429_MAX_TOTAL)。
      # 出典: ホシビヨリ step5_cloud_forecast/grid_cache.py 55・56 行 MINUTELY_RETRY_WAIT_SEC = 65.0・MINUTELY_RETRY_MAX = 5
      # (1 分の上限の 429 で 65 秒待って同じセルを取り直すのは 1 回の実行で 5 回まで。commit 3860af7・1.2.0 で確認)。
      http_429_max_total: 5
      # 出力の schema の文字列(--json-out。schemas/hoshibiyori-explore.schema.json)
      expected_schema: hoshibiyori-explore/1
  # Open-Meteo のメタデータ(利用上限に数えられない。yamabiyori-backtest backtest/collect_forecast_snapshot.py の説明)で記録するモデル
  model_runs: [jma_msm, ecmwf_ifs025]
  # メタデータ取得のリクエスト上限(子プロセス 1 回あたり。モデル 2 つ + 失敗したモデルの読み直し 最大 2 = 4。余裕を見て 8。仮置き)
  meta_max_requests: 8
  # 棚が古いとみなす時間(時間)。答える側が使う(答えの文 concierge/brief.py と、status の表示)。取得の側は使わない。
  # 利用者の決定(2026-11-25): 12 → 18 → 24。24 は「丸1日以上前の予報」。取得は朝と夕の 1 日 2 回だが、定期の起動は数時間遅れることがあり、
  # 回のあいだが 18 時間を超えた例が 2 回あった(18.1・19.1 時間)。18 だと、取得が正常でも「古い予報」と出る日がある。
  # 取得の時刻(schedule_utc)は変えない。(はじめの値 12 は、指示書 6.2「半日以上古いとき」の半日)
  stale_after_hours: 24
  # 取得の時刻(利用者の決定 D3: 朝 4:27 / 夕 16:47 日本時間)。collect.yml の cron と一致することをテストで検査する。
  schedule_utc: ["27 19 * * *", "47 7 * * *"]
  # yamabiyori-backtest の収集の cron(.github/workflows/collect.yml「収集」の行。commit 964293a で確認。参照のみ)。
  # 取得の時刻と重ならないことをテストで検査する(cron の文字列を読むだけ)。
  backtest_cron_utc: "20 */3 * * *"
  # 重ならないとみなす最小の間隔(分)。仮置き(バックテストの収集の所要時間は未確認)。
  backtest_min_gap_minutes: 30

estimated_calls:
  # Open-Meteo の call 換算の「推定」。公式の式は未確認(指示書 U7)。仮置きの式:
  #   1 リクエスト = max(1, 変数の数 / variables_per_call) × max(1, 日数 / days_per_call)
  # 変数の数は hourly と daily の合計、日数は forecast_days + past_days(記録がなければ 1 倍)。メタデータの取得は 0 と数える。
  # 地点を複数まとめたリクエストや models の複数指定は、フックの記録にないため数えられない(過小になりうる)。
  variables_per_call: 10
  days_per_call: 14

diag:
  # 診断(diagnose.yml・collect/diag_probe.py)。api.open-meteo.com の IP アドレスごとに meta.json(jma_msm)を取る。手動実行だけ。
  per_ip: 30            # IP ごと・方式ごとの回数(利用者の指示。新しい接続 30 回 + 使い回し 30 回)
  interval_s: 1.0       # 回と回のあいだ(秒。始まりから次の始まりまで)。1 秒以上(利用者の指示。1 未満は 1 にする)
  timeout_s: 10         # 打ち切り(秒。TCP の接続・TLS・応答待ち・受信の各段階ごと)(利用者の指示)
  max_ips: 8            # 調べる IP の数の上限。仮置き(名前解決で何個返るかは未確認)
  max_requests: 300     # 合計の回数の上限(計測フックでも強制)。仮置き(1 回目の診断の IP 2 個 × 2 方式 × 30 回 = 120。IP が 5 個までなら全部の回が収まる)
  total_timeout_s: 1800 # 全体の時間の上限(秒)。超えたら次の回を始めない。仮置き(120 回なら 1 秒おきで約 2〜3 分。失敗が多いときの余裕。diagnose.yml の timeout-minutes 40 の内側)

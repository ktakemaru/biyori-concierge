# 山・星の予報をまとめて取得し、棚(data ブランチ)に置く(指示書 5 章)。
# 実通信が起きるのは次の 2 つだけ:
#   手動実行(workflow_dispatch): confirm に yes-run-live と入れたとき。
#   定期実行(schedule)        : 日本時間 4:27 と 16:47(UTC の 19:27 と 7:47)。リポジトリの変数 BIYORI_COLLECT_SCHEDULE が on のときだけ(停止スイッチ)。
#                                 段階 5 までは on にしない。未設定・他の値なら collect は skipped、publish も動かない。
# Open-Meteo への通信は、collect ジョブの中で、計測フック(collect/measure/sitecustomize.py)を付けた子プロセスだけが行う。
#
# 2 つのジョブに分ける(権限の分離。biyori-hub の fetch-autumn.yml と同じ考え方):
#   collect : 読み取り権限のみ。実通信はここだけ。成果物は artifact に置く。
#   publish : 書き込み権限はここだけ。取得のコードは実行しない(整形と git 操作だけ)。
#             親なしの 1 コミットを data にだけ強制 push する(main には push しない)。
name: collect

on:
  schedule:
    - cron: "27 19 * * *"    # 日本時間 4:27(朝)
    - cron: "47 7 * * *"     # 日本時間 16:47(夕)
  workflow_dispatch:
    inputs:
      confirm:
        description: "実通信を行う確認。yes-run-live と入れたときだけ実行する"
        required: true
        type: string
      agents:
        description: "取得するビヨリ(yamabiyori = 山だけ / hoshibiyori = 星だけ。棚の山は前回のまま / both = 山と星)"
        required: true
        type: choice
        options: [yamabiyori, hoshibiyori, both]
        default: yamabiyori
      yama_limit:
        description: "山の数。全 76 座は all と入れる。一部なら 1 以上の整数(初期値 all)。all でない回は、publish にチェックがあっても棚に載せない(棚は置き換わらない)。空・0 以下・それ以外の文字はエラーで止まる"
        required: false
        type: string
        default: "all"
      yamabiyori_ref:
        description: "ヤマビヨリのブランチか commit(初期値 main)。main 以外で取った回は、publish にチェックがあっても棚に載せない。定期実行は常に main"
        required: false
        type: string
        default: main
      publish:
        description: "取得の結果を棚(data ブランチ)に残す(初期値 チェックあり)。残るのは yama_limit が all の回だけ"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

# 棚の更新が同時に走って競合しないように、実行を 1 つずつにする(待たせる。途中の実行は止めない)。
concurrency:
  group: biyori-collect
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.BIYORI_COLLECT_SCHEDULE == 'on') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90          # 利用者の決定(2026-11-11)で 90 のまま(山の実測 約 137 秒〜2153 秒)。段階 3 で星の実測を見て見直す
    permissions:
      contents: read
    env:
      PYTHONUTF8: "1"
      # 定期実行で取るビヨリは、リポジトリの変数 BIYORI_COLLECT_AGENTS(yamabiyori / hoshibiyori / both)で選ぶ(指示書 5.1。2026-11-22)。
      # 未設定・それ以外の値は yamabiyori(山だけ)。手動実行は入力の agents のまま。
      # 値は変数をそのまま渡さず、決まった文字列だけを出す(式の == は大文字・小文字を区別しないため、Both と書いても both になる)。
      AGENTS: ${{ github.event_name == 'schedule' && ((vars.BIYORI_COLLECT_AGENTS == 'both' && 'both') || (vars.BIYORI_COLLECT_AGENTS == 'hoshibiyori' && 'hoshibiyori') || 'yamabiyori') || inputs.agents }}
      # 定期実行は all(全 76 座)。手動実行は入力のまま渡し、検査は collect run が通信の前に行う(空・0 以下などはエラー)
      YAMA_LIMIT: ${{ github.event_name == 'schedule' && 'all' || inputs.yama_limit }}
      # 定期実行は常に main。手動実行は入力のまま渡し、検査は check-inputs が取り出しの前に行う(空・記号で始まるなどはエラー)
      YAMABIYORI_REF: ${{ github.event_name == 'schedule' && 'main' || inputs.yamabiyori_ref }}
    steps:
      - name: Check confirmation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "yes-run-live" ]; then
            echo "confirm が yes-run-live と一致しないため中止します(実通信はしていません)"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install concierge dependencies
        run: python -m pip install -r requirements.txt
      # 山の数とヤマビヨリの ref を、ヤマビヨリを取り出す前に検査する(通信なし)。main 以外・山の一部だけなら「棚に載せない」と表示する
      - name: Check inputs (no network)
        run: python -X utf8 -m collect check-inputs --yama-limit "$YAMA_LIMIT" --yamabiyori-ref="$YAMABIYORI_REF"
      - name: Get yamabiyori (main, or yamabiyori_ref on a manual run)
        if: ${{ env.AGENTS == 'yamabiyori' || env.AGENTS == 'both' }}
        uses: actions/checkout@v4
        with:
          repository: ktakemaru/yamabiyori
          ref: ${{ env.YAMABIYORI_REF }}
          path: _agents/yamabiyori
          persist-credentials: false
      # ヤマビヨリは別の venv に、ヤマビヨリの requirements.txt だけを入れる(Playwright は入れない)。
      - name: Install yamabiyori dependencies (own venv)
        if: ${{ env.AGENTS == 'yamabiyori' || env.AGENTS == 'both' }}
        run: |
          python -m venv _venvs/yamabiyori
          _venvs/yamabiyori/bin/python -m pip install -r _agents/yamabiyori/requirements.txt
      - name: Get hoshibiyori (always main)
        if: ${{ env.AGENTS == 'hoshibiyori' || env.AGENTS == 'both' }}
        uses: actions/checkout@v4
        with:
          repository: ktakemaru/hoshibiyori
          ref: main
          path: _agents/hoshibiyori
          persist-credentials: false
      # ホシビヨリも別の venv に、ホシビヨリの requirements.txt だけを入れる(天気図の取得に使う任意の依存は入れない)。
      - name: Install hoshibiyori dependencies (own venv)
        if: ${{ env.AGENTS == 'hoshibiyori' || env.AGENTS == 'both' }}
        run: |
          python -m venv _venvs/hoshibiyori
          _venvs/hoshibiyori/bin/python -m pip install -r _agents/hoshibiyori/requirements.txt
      # 持ち越すのは、期限の無いもの 2 つだけ: 天文暦 de421.bsp と、薄明・月の時刻の計算結果(astro_cache。7 日より前の夜はホシビヨリが消す)。
      # 予報の保存(cloud_cache。期限 3 時間・6 時間)は次の回には使えないので持ち越さない。
      - name: Carry over the ephemeris
        if: ${{ env.AGENTS == 'hoshibiyori' || env.AGENTS == 'both' }}
        uses: actions/cache@v4
        with:
          path: _hoshi_data/step1_astronomy/de421.bsp
          key: hoshibiyori-de421-v1
      - name: Carry over the computed twilight and moon times
        if: ${{ env.AGENTS == 'hoshibiyori' || env.AGENTS == 'both' }}
        uses: actions/cache@v4
        with:
          path: _hoshi_data/step1_astronomy/astro_cache
          key: hoshibiyori-astro-v1-${{ github.run_id }}
          restore-keys: hoshibiyori-astro-v1-
      - name: Collect (live)
        id: run
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python -X utf8 -m collect run --agents "$AGENTS" --out _out \
            --yamabiyori-checkout _agents/yamabiyori --yamabiyori-python "$PWD/_venvs/yamabiyori/bin/python" \
            --hoshibiyori-checkout _agents/hoshibiyori --hoshibiyori-python "$PWD/_venvs/hoshibiyori/bin/python" \
            --hoshibiyori-data-dir "$PWD/_hoshi_data" \
            --yama-limit "$YAMA_LIMIT" --yamabiyori-ref="$YAMABIYORI_REF" --trigger "$EVENT_NAME" --concierge-commit "$GITHUB_SHA"
      # 確認で止まったとき(取得していないとき)は、成果物も要約も作らない。
      - name: Upload results
        if: ${{ always() && steps.run.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: collect-result
          path: _out/
          if-no-files-found: warn
          retention-days: 14
      - name: Write the run summary
        if: ${{ always() && steps.run.outcome != 'skipped' }}
        run: python -X utf8 -m collect summary --artifact _out >> "$GITHUB_STEP_SUMMARY"
      # 失敗したビヨリがあれば、ここでジョブを赤にする(成果物は上で残してある。publish は成功したビヨリだけを入れ替える)。
      - name: Fail if a requested agent is not ok
        run: python -X utf8 -m collect verdict --artifact _out

  # ヤマビヨリを main 以外の ref で取った手動実行は、publish にチェックがあっても動かさない(棚に載せない。collect の Summary にその旨が出る)。
  # 一部の山だけを取った手動実行(yama_limit が all でない)も、同じように動かさない(棚がその山だけに置き換わるため。利用者の決定 2026-11-25)。
  # 念のため collect prepare も、run.json の ref が main でない・山の数が全部でないときは、木を組み立てずに止まる。
  publish:
    needs: collect
    if: ${{ always() && needs.collect.result != 'cancelled' && needs.collect.result != 'skipped' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish == true && (inputs.yamabiyori_ref == 'main' || inputs.agents == 'hoshibiyori') && (inputs.yama_limit == 'all' || inputs.agents == 'hoshibiyori'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check confirmation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "yes-run-live" ]; then
            echo "confirm が yes-run-live と一致しないため中止します(何も書いていません)"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install concierge dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: collect-result
          path: _artifact
      - name: Get the current data branch (absent on the first run)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: data
          path: _data
          persist-credentials: false
      - name: Build the tree to publish (no network, no collect code)
        run: |
          mkdir -p _data
          python -X utf8 -m collect prepare --artifact _artifact --existing _data --out "$RUNNER_TEMP/publish"
      - name: Commit without history and force-push to data only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/publish"
          test -f manifest.json
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json ATTRIBUTION.md
          for p in logs yamabiyori hoshibiyori proposals; do if [ -e "$p" ]; then git add "$p"; fi; done
          git commit -q -m "data: collect (run ${GITHUB_RUN_ID}). 履歴は残さない(毎回この 1 コミットに置き換える)"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push --force origin HEAD:refs/heads/data

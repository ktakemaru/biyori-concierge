# 照合(concierge verify)の語の一覧と値。検査のコード名と意味は docs/answer-checks.md。
# 一覧はどれも「仮置き」(段階 2 の作業指示書 6.2。実際に止めすぎ・通しすぎた文を見てから直す)。
schema: biyori-concierge-verify/1

draft:
  # 根拠の印。Y=山と日の事実、C=比べた結果、N=危険信号の件数、L=決まった文、K=知識カード、G=足りないもの
  marker_re: '\[([YLKGCN]\d{1,3})\]'
  # おすすめにした事実の宣言(下書きの最後の行)。送る文からは取り除く
  picks_heading: '[おすすめ]'

numbers:
  # 数字のあとに続くと「数字と単位」とみなす語。長いものから並べる(仮置き)
  units: ['m/s', 'J/kg', 'km', 'mm', 'cm', 'hPa', 'm', '℃', '%', '点', '時間', '時', '分', '日', '座', '位', '番目', '度', '円']
  # 数字のあとに続いても数として照らさない語(数え方の語。仮置き)
  counters: ['つ', 'か所', 'カ所', '件', '人', '回', '通り', '段']

words:
  # 天気の語(種類 A。印のない文に書くと weather_unmarked)。仮置き
  weather: ['晴', '曇', 'くもり', '雨', '雪', '風', '雲', '霧', '雷', 'ガス', '見通し', '視程', '気温', '体感', '寒', '暑', '暖か',
            '冷え', '天気', '天候', '降水', '降る', '荒れ', '快晴', '展望', '眺望', '見晴らし']
  # 天気の語を含むが天気の話ではない語(先に取り除いてから照らす)
  weather_ok: ['風景', '風情', '和風', '風習', '風物', '素晴', '晴れやか']
  # 危険信号の語(種類 A。印のない文に書くと hazard_unmarked)
  hazard_kinds: ['雷', '強風', '低体温症', '危険信号']
  hazard_levels: ['警戒以上', '注意', '警戒', '危険']
  # 種類(雷・強風・低体温症)を書かずに段階だけを言う言い方。{lv} は段階の語(利用者の決定 2026-11-23。形は仮置き)。
  # 印の事実の「いちばん重い段階」と合っていれば通す。exact = ちょうどその段階 / until = その段階まで(ちょうど) / at_least = その段階以上
  hazard_level_forms:
    at_least: ['危険信号\s*[のがはも:]?\s*[「(]?{lv}[」)]?以上', '{lv}以上の危険信号']
    until: ['危険信号\s*[のがはも:]?\s*[「(]?{lv}[」)]?まで', '{lv}までの危険信号']
    exact: ['危険信号\s*[のがはも:]?\s*[「(]?{lv}[」)]?', '{lv}の危険信号']
  # 上の言い方のすぐあとに続くと、打ち消し(出ていない)とみなす言い方(仮置き)
  hazard_level_not_re: '^\s*(?:が?出てい[るた])?(?:の?山)?[はがもで]*\s*(?:出てい(?:ない|ません|なく)|ありません|ない|なし|なく)'
  # 山の安全に関わる語(種類 C。危険信号の事実・知識カードの印がない文に書くと safety_without_basis。足りないものの印 [G…] だけでは通さず、
  # safety_exempt の言い方を含む文だけを通す。段階 2 の仕上げ 6.1)。仮置き
  safety: ['装備', '凍結', '積雪', '残雪', '難易度', '難し', '易し', 'やさし', '初心者', '初級', '中級', '上級', 'ビギナー',
           '所要時間', 'コースタイム', '歩行時間', '通行止め', '通行規制', '閉鎖', '引き返', '登れます', '登れる', '安全', '危な',
           '滑落', '転倒', 'アイゼン', 'チェーンスパイク', 'ピッケル', 'ヘッドランプ', '防寒', '雨具', 'レインウェア', '冬山', '雪山',
           '岩場', '鎖場', 'ハシゴ', '急坂', '急登', '体力', '健脚', '道迷い', '時間がかか', '歩きやす', '登りやす', 'ロープウェイが運']
  # 種類 C のうち、危険信号の事実の印で通してよい語(強風・低体温症・雷の注意の文に出る語)。ほかの語(難しさ・岩場・急坂・凍結・積雪・
  # 所要時間・通行止めなど)は、危険信号の事実の印では通さない(知識カード・足りないものの印・「判断できません」の形だけ)。仮置き
  safety_hazard_ok: ['防寒', '雨具', 'レインウェア', '引き返', '装備']
  # 種類 C のうち、安全の言い切り(行ける・安全だ と言う語)。危険信号の事実の印では通さず、知識カードの印だけで通す
  # (段階 2 の通しの試しで「富士山は100点なので登れます。[危険信号つきの事実]」が通ったため。仮置き)
  safety_positive: ['安全', '登れます', '登れる', '大丈夫', '問題な', '心配な', '危なくな', '初心者でも', '誰でも']
  # 種類 C の語があっても通す言い方(「分からない」と言う文)。この言い方の部分は内部の言葉の検査からも外す
  safety_exempt: ['この予報からは判断できません', 'この資料からは判断できません', 'この資料にはありません', '判断できません',
                  '分かりません', 'わかりません', '情報はありません', '含まれていません',
                  # 「判断できない」で始まる言い方(段階 3 の前の準備 3.4。利用者の決定 2026-11-24。形は仮置き)。「判断できないわけではない」
                  # 「判断できないとは言えない」のように打ち消す形を通さないよう、続く語まで書く
                  '判断できないので', '判断できないため', '判断できないから', '判断できないものの', '判断できないが', '判断できないけれど', '判断できないけど',
                  '判断できない、', '判断できない。', '判断できないです', '判断できないまま', '判断できず']
  # おすすめの語(すすめた山の宣言と照らす)
  # 「点数がいちばん高い山は見送る」をおすすめの語として止めないよう、「いちばん」「一番」だけでは見ない(段階 2 の通しの試しで止めすぎた)。
  # 「点数がいちばん高い」が本当かは、比べる文の検査(compare)で見る
  recommend: ['おすすめ', 'お勧め', 'お薦め', 'イチオシ', '最適', 'ベスト', '行くなら']
  # おすすめの語があっても、見送りを言う文は照らさない
  recommend_not: ['見送']
  # 内部の言葉・作業の経過(internal_word)。正規表現。仮置き
  internal: ['棚', 'manifest', '[Pp]roposal', '[Bb]and\b', '資料', '印(?!象)', '\b[Ii][Dd]\b', 'カード', '照合', '検査', '下書き',
             'スナップショット', '[Bb]rief', '[Vv]erify', 'sync', '合格', '不合格', '控えの文', '書き直し', 'コード', 'エージェント',
             'スキーマ', 'JSON']
  # 読む人への問いかけ(question_in_answer)・できないことの提案(offer_in_answer)。正規表現
  question: ['[?？]', 'ますか[。!！]?$', 'でしょうか', 'いかが', 'ませんか']
  offer: ['ましょうか', 'しますね', 'お調べします', 'お伝えできます']
  # 英語のメモ(english_note): 英字の語が 3 つ以上続く
  english_re: '[A-Za-z]+(?:[\s,.:;-]+[A-Za-z]+){2,}'
  # 宿・山小屋の具体名(lodging_name)。語の終わりの形で見る(仮置き。名前の一覧は持っていないので、この形でない名前は止められない)
  lodging_re: '[一-龥々ヶヵァ-ヴーA-Za-z]{1,12}(?:山荘|小屋|ヒュッテ|ロッジ|旅館|ホテル|民宿|ペンション|ゲストハウス|ハウス|荘)'
  lodging_ok: ['山小屋', '小屋', '避難小屋']
  # 76 座にない山の名前の見つけ方(unknown_mountain)。語の終わりの形で見る(仮置き)
  mountain_re: '[一-龥々ヶヵァ-ヴー]{1,8}(?:山|岳|峰|嶺)'
  # 上の形でも山の名前ではない語(この語で終わるものは見ない)
  mountain_common: ['登山', '下山', '低山', '高山', '雪山', '冬山', '名山', '入山', '火山', '里山', '山岳', '岩山', '裏山', '本山', '沢山',
                    '鉱山', '連山', '山々', '最高峰', '連峰', '名峰', '両山', '主峰', '霊峰', '近郊の山', '日本百名山', '百名山', '登る山', '人気の山', '同じ山', '別の山', '近い山', '遠い山']
  # ビヨリをまたいで点を比べる文(score_across_biyori): 点数の語と、ほかのビヨリの語が同じ文にある
  other_biyori: ['星', 'ホシビヨリ', 'イキモノビヨリ', '生き物', '紅葉', '花']

# 危険信号の件数の事実 [N…] と、「どれも・全部」の文の検査(段階 2 の小さな直し 3.3。利用者の決定 2026-11-23)。語の一覧はどれも仮置き
hazard_count:
  # 「全部」を言う語。危険信号の語と同じ文にあれば、件数の事実の印を求める
  universal: ['どれも', '全部', 'すべて', '全て', 'どの山も', 'どこも', 'いずれも', 'みんな', '全座']
  # 上の語を含むが「全部」を言っていない言い方(先に取り除く)
  universal_ok: ['全部で', 'すべてで', '全てで']
  # 山の名前を並べた「どれも」(段階 3 の前の準備 3.3。利用者の決定 2026-11-24)。名前を sep でつなぎ、そのすぐあとに tail と「どれも」などが続く形だけ。語は仮置き
  listed_sep: '(?:、|,|・|と、?)'
  listed_tail: '(?:の(?:[0-9]+|[二三四五六七八九十])つ)?(?:に|で)?(?:は|も|が)?[、,]?'
  # 山の名前を並べた「どれも」でも、文にあれば合うかどうかを決められないとみなす語(止める)/ 危険信号を言う節にあるとき(打ち消し)
  listed_not: ['基準', '未満', '以外', '除', '限ら', '限り', 'わけ', 'とは言', 'とはい', 'ほぼ']
  listed_not_clause: ['ない', 'なし', 'なく', 'ません']
  # 対象の日の全部を言う語(日を 2 つ以上言ったとみなす)
  listed_all_days: ['週末', '土日', '両日', '2日とも', '二日とも', 'どちらの日']
  # 「どれも」の文に要る、範囲の語(件数の事実が数えているのは、基準点以上の山の全部)
  universal_scope: ['基準']
  # 「どれも」の文で、合うかどうかを決められないとみなす語(止める)
  not_words_universal: ['まで', '未満', '以外', '除', '限ら', 'わけ', 'ほとんど', '多く', 'ほぼ']
  # 割合・ぼかした言い方。危険信号の語と同じ文にあれば止める(件数と照らさない)。一覧は仮置き(段階 3 の前の準備 3.5。利用者の決定 2026-11-24)
  vague: ['ほとんど', '大半', '大部分', '大多数', '半分以上', '半分近く', '半数', '過半', '何割', '割の山', '割以上', '割近く', 'おおむね', 'ほぼ全', 'ほぼすべて',
          '多くの山', '山の多く', '多数の山', 'ほかの山も', 'ほかの山にも', 'ほかの山には', 'ほかの山でも', '他の山も', '他の山にも', '他の山には', '他の山でも',
          '高い山ほど', '低い山ほど', '高いほど', '低いほど']
  # 段階の語(危険信号の「危険」は先に取り除いて読む)
  levels: ['警戒以上', '警戒', '危険']
  # 山の数の単位
  units: ['座', '件']
  # 段階の語と数のあいだにあると、数を照らせないとみなす語(止める)
  not_words: ['ない', 'なし', 'なく', 'ません', '未満', '以外', '除', 'まで', '約', '前後']

# 比べる文(最上級の語)の検査(段階 2 の仕上げ 6.2)。語の一覧はどれも仮置き
compare:
  # 最上級の語。山の名前を先に取り除いてから探す
  superlatives: ['いちばん', '一番', '最も', 'もっとも', '最強', '最弱', '最高', '最低', '最大', '最小', '最多', '最少', '最短', '最長', '最遠', '最寄']
  # 最上級の語を含むが、比べる文ではない言い方(先に取り除く)
  ok: ['いちばんのおすすめ', '一番のおすすめ', 'いちばんおすすめ', '一番おすすめ', 'いちばんにおすすめ', 'いちばんよさそう', '一番よさそう', 'いちばん良さそう', '一番良さそう',
       '最高峰', '最高気温', '最低気温', '最高の一日', '最高の週末', '最高の眺め', '最高の景色', '最低でも', '一番乗り']
  # 最上級の語のあと何字までを「いちばん○○」の○○とみなすか
  window: 10
  topics:
    wind: ['風']
    wind_weak: ['弱', '穏やか', 'おだやか', '静か']
    wind_strong: ['強']
    near: ['近', '最寄']
    far: ['遠']
    score: ['点数', 'スコア', '最高点', '最低点', '得点', '点で', '点と']
    high_low: ['高', '低']
    low: ['低']
    # ほかの比べ方(比べた結果の事実がないので、いつも止まる)。段階 2 の仕上げの通しの試しで「雲量はいちばん少ない」が通ったため足した
    other: ['少な', '多い', '多く', '寒', '暖', '涼', '最少', '最多']
    # 「高い・低い」が点数でないと分かる語(同じ節にあるとき)
    not_score: ['標高', '気温', '体感', '雲', '視程', '降水', '雨', '風']
  # 比べた結果の事実を使う文に要る語(何の中で比べたか)
  scope: ['候補']
  # 「点数がいちばん高い」の検査を当てない文の語。空 = 見送りの文にも当てる(利用者の決定 2026-11-23)
  score_skip: []
